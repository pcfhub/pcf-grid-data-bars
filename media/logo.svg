<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Two cells, each with a bar and the track it is measured against.

       The track is the identity. A bar on its own is a length; a bar in a track
       is a PROPORTION, which is the only thing this control adds to a numeric
       column, and it is why the pale rectangle under each bar is not decoration
       and must not be dropped to simplify the mark.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px. Three rows fitted the canvas and lost the tracks, because
       a 0.3 fill three pixels tall next to a solid one of the same height reads
       as one soft-edged bar. Two rows at 12 tall keep track and bar separable.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="grid-data-bars-ramp" x1="6" y1="82" x2="90" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The grid. -->
  <rect x="6" y="14" width="84" height="68" rx="16" fill="url(#grid-data-bars-ramp)"/>

  <!-- Track, then bar. Same x and y, different width: the bar is a fraction of
       the track, drawn as one. -->
  <rect x="18" y="30" width="60" height="12" rx="6" fill="#F8FAFC" fill-opacity="0.3"/>
  <rect x="18" y="30" width="44" height="12" rx="6" fill="#F8FAFC"/>
  <rect x="18" y="54" width="60" height="12" rx="6" fill="#F8FAFC" fill-opacity="0.3"/>
  <rect x="18" y="54" width="26" height="12" rx="6" fill="#F8FAFC"/>
</svg>
